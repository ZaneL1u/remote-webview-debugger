<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <title>共存测试</title>
    <!-- Other debug tools first, as pages that already use them do. -->

      body { font: 16px sans-serif; margin: 0; padding: 16px; }
      .bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px; background: #fff; }
      .bottom button { flex: 1; padding: 14px; }
    </style>
  </head>
  <body>
    <h1>共存测试</h1>
    <p id="out">未点击</p>
