<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1017" />
    <meta name="description" content="Remote Debugger console: let AI remotely debug every WebView in your app." />
    <title>Remote Debugger</title>
    <script>
      // Apply the saved theme before the first paint (lib/theme.ts owns the key).
      try {
        var t = localStorage.getItem('rwd:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
      // Same language rule as src/i18n/index.ts: the saved choice, else the first browser language we have.
      try {
        var all = ['en', 'zh', 'zh-TW', 'ar', 'de', 'es', 'fr', 'ja', 'ko', 'pt', 'ru']
        var l = null
        try {
          l = localStorage.getItem('rwd.lang')
        } catch (e) {}
        if (all.indexOf(l) < 0) {
          l = 'en'
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
          for (var i = 0; i < prefs.length; i++) {
            var p = String(prefs[i]).toLowerCase().replace(/_/g, '-').split('-')
            var m = p[0] === 'zh' ? (p.indexOf('hant') > 0 || (p.indexOf('hans') < 0 && /-(tw|hk|mo)\b/.test(p.join('-'))) ? 'zh-TW' : 'zh') : p[0]
            if (all.indexOf(m) >= 0) {
              l = m
              break
            }
          }
        }
        document.documentElement.lang = l === 'zh' ? 'zh-CN' : l
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
