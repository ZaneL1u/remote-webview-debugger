# Gateway + a small Caddy in front that also serves the demo sites. Only
# `web` is published; it is meant to sit behind a TLS-terminating proxy
# (or add compose.tls.yml to serve HTTPS directly).
#
# .env (chmod 600):
#   RWD_ADMIN_PASSWORD=<console admin password>
#   RWD_PUBLIC_URL=https://<host>/v1
#   RWD_METRICS_TOKEN=<bearer token for /v1/metrics>   (generated by deploy.sh)
#   RWD_ADMIN_EMAIL=<owner account>                    (default admin)
#   RWD_DATABASE_URL=postgres://…                      (default: SQLite in ./data)
#   RWD_TRUSTED_PROXIES=<ranges of the proxy in front> (default: private_ranges)
#   RWD_LANG=en|zh                                     (agent-facing language, default en)
#   RWD_MCP_RATE_LIMIT=<MCP requests per IP per minute> (default: no limit)
#   RWD_DEMO_KEYS=1                                    (public demo: a key per visitor)
#   BIND=<address to publish on>   (default 127.0.0.1)
#   PORT=<published port>          (default 18788)
#   RWD_DOMAIN=<public host name>  (compose.tls.yml only)
services:
  gateway:
    build: .
    # One image per stack, so two stacks on a host don't swap each other's.
    image: rwd-gateway:${COMPOSE_PROJECT_NAME:-local}
    restart: unless-stopped
    environment:
      RWD_TRUST_PROXY: "1" # only `web` reaches it
      RWD_ADMIN_PASSWORD: ${RWD_ADMIN_PASSWORD:?set RWD_ADMIN_PASSWORD in .env}
      RWD_PUBLIC_URL: ${RWD_PUBLIC_URL:-}
      RWD_ADMIN_EMAIL: ${RWD_ADMIN_EMAIL:-}
      RWD_METRICS_TOKEN: ${RWD_METRICS_TOKEN:-}
      RWD_DATABASE_URL: ${RWD_DATABASE_URL:-}
      RWD_AUDIT_RETENTION_DAYS: ${RWD_AUDIT_RETENTION_DAYS:-}
      RWD_LANG: ${RWD_LANG:-}
      RWD_MCP_RATE_LIMIT: ${RWD_MCP_RATE_LIMIT:-}
      RWD_DEMO_KEYS: ${RWD_DEMO_KEYS:-}
    volumes:
      - ./data:/data

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      RWD_TRUSTED_PROXIES: ${RWD_TRUSTED_PROXIES:-private_ranges}
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-18788}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./demo:/srv/demo:ro
