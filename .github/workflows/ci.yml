name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  docs:
    name: Docs translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/docs/i18n.mjs check

  gateway-postgres:
    name: Gateway on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: rwd
          POSTGRES_DB: rwd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: go test (Postgres)
        working-directory: gateway
        env:
          RWD_TEST_DATABASE_URL: postgres://postgres:rwd@127.0.0.1:5432/rwd?sslmode=disable
        run: go test -race -count=1 ./internal/server/

  sdk:
    name: Page SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: npm run typecheck
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - name: Size budget (gzip < 88 KB; language packs other than en / zh load on demand)
        working-directory: sdk
        run: |
          size=$(gzip -9c dist/sdk.js | wc -c)
          echo "sdk.js gzip: $size bytes"
          test "$size" -lt 90112
      - name: Package contents
        working-directory: sdk
        run: npm pack --dry-run
      - run: npx playwright install --with-deps chromium webkit
        working-directory: sdk
      - run: npm test
        working-directory: sdk
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sdk-test-results
          path: sdk/test-results/

  console:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: e2e against the mock gateway
        run: |
          node mock/server.mjs &
          for i in $(seq 30); do curl -fs http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          npm run test:e2e

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build the SDK the demo runs, then the site
        run: make website

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [gateway, sdk, console]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
      - name: Build the gateway binary (embeds SDK + console)
        run: make sdk console && make gateway GOOS=linux GOARCH=amd64
      - name: Build the image
        run: |
          cp gateway/bin/rwd-linux-amd64 deploy/platform/rwd
          docker build -t remote-webview-debugger:ci deploy/platform
